name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generated from wrangler.jsonc, not committed.
      - run: npx wrangler types
      - run: npx tsc --noEmit
      - run: npx vitest run
